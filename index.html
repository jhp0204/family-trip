#boot{font-family:system-ui,sans-serif;color:#66718A;text-align:center;padding:96px 20px;font-size:15px;font-weight:600}
.jt-dots{display:flex;justify-content:center;gap:9px;height:22px;align-items:flex-end;margin-bottom:14px}
.jt-dots i{width:10px;height:10px;border-radius:50%;animation:jt-dot 1.1s ease-in-out infinite}
.jt-dots i:nth-child(1){background:#E8800A}
.jt-dots i:nth-child(2){background:#D9262E;animation-delay:.15s}
.jt-dots i:nth-child(3){background:#0A9B6E;animation-delay:.3s}
@keyframes jt-dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-10px);opacity:1}}
@media (prefers-reduced-motion:reduce){.jt-dots i{animation:jt-dotfade 1.4s ease-in-out infinite}@keyframes jt-dotfade{0%,100%{opacity:.35}50%{opacity:1}}}
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "firebase/app": "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"
  }
}
</script>
</head>
<body>
<div id="root"><div id="boot" role="status" aria-live="polite"><div class="jt-dots" aria-hidden="true"><i></i><i></i><i></i></div>앱 준비 중</div></div>
<script>
setTimeout(function () {
  var b = document.getElementById("boot");
  if (b) b.textContent = "앱을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.";
}, 15000);
</script>
<script type="module" src="app.js"></script>
</body>
</html>
